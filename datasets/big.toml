# ===========================================================================
# RECIPE for datasets/big.xlsx - the MAIN demo dataset
# (10 majors, 4 years, 10 rooms of 9x9)
# ===========================================================================
# The app and `make data` read the WORKBOOK (datasets/big.xlsx), not this
# file. This recipe only says how to make that workbook with a random
# roster, for testing:
#
#     make workbooks          # rewrites datasets/big.xlsx and small.xlsx
#
# Edit the workbook directly to change real students, subjects or rooms.
# ===========================================================================

title = "SmartExamSeat - main demo dataset (10 majors, 4 years)"
seed = 20261115               # change for a different random roster
years = [1, 2, 3, 4]

# Used for every major / year that does not set its own value below.
[defaults]
students = 50                 # students in one (major, year) cohort
subjects = 5                  # exams every student of that cohort sits
access_rate = 0.03            # share of students who need an accessible seat

# ---------------------------------------------------------------------------
# Majors. One table per major; the table name is the major's code, written
# in lowercase here (Prolog atoms must start lowercase) and shown in
# UPPERCASE in the UI and exports.
# `students` and `subjects` are either a single number (same for every year)
# or a list with one number per year, year 1 first. Leave a table empty to
# use the defaults.
# ---------------------------------------------------------------------------

[majors.se]                   # SE  - Software Engineering
students = [50, 50, 50, 45]
subjects = [5, 3, 4, 4]

[majors.ce]                   # CE  - Computer Engineering
subjects = [4, 5, 5, 4]

[majors.cs]                   # CS  - Computer Science

[majors.ee]                   # EE  - Electrical Engineering

[majors.eme]                  # EME - Engineering Management and Entrepreneurship
students = 40             

[majors.me]                   # ME  - Mechanical Engineering

[majors.rai]                  # RAI - Robotics and AI Engineering
subjects = [5, 5, 4, 3]

[majors.ene]                  # ENE - Energy Engineering

[majors.ie]                   # IE  - Industrial Engineering

[majors.bme]                  # BME - Biomedical Engineering
students = [45, 45, 40, 40]

# ---------------------------------------------------------------------------
# Exam period: one session per slot per weekday, starting on start_date.
# Weekends are skipped. days x slots = number of sessions available.
# ---------------------------------------------------------------------------
[exam_period]
start_date = "2026-12-01"
days = 10                     # two working weeks: 20 sessions
slots = [["09:30", "12:30"], ["13:30", "16:30"]]

# ---------------------------------------------------------------------------
# Timetabling (the Prolog CSP in timetable.pl)
# ---------------------------------------------------------------------------
[timetable]
# A session may hold at most this share of the open seats. Leaving room
# keeps the seating CSP easy: same-exam students must sit apart.
max_fill_percent = 80

# ---------------------------------------------------------------------------
# Rooms. Room ids are numbered r101, r102, ... in the order listed.
# ---------------------------------------------------------------------------
[rooms]
accessible_front_cols = [1, 3, 5, 7]   # front-row seats for accessible students

[[rooms.groups]]              # 10 rooms of 9x9 = 81 seats each, r101-r110
count = 10
rows = 9
cols = 9
available = true

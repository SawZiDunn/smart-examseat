# ===========================================================================
# RECIPE for datasets/small.xlsx - the SMALL demo dataset
# ===========================================================================
# Small enough to picture in your head:
#
#             SE                CS                EE
#   year 1    30 students       30 students       -
#             3 subjects        3 subjects
#   year 2    20 students       20 students       20 students
#             2 subjects        2 subjects        2 subjects
#
#   = 120 students, 12 subjects, 300 exam seats to fill
#   3 exam days x 2 slots = 6 sessions
#   2 rooms of 8x8 = 128 seats (8 accessible)
#
# RECIPE for datasets/small.xlsx: the app reads the workbook, not this file.
# `make workbooks` rewrites the workbook from this recipe (random names).
# ===========================================================================

title = "SmartExamSeat - small demo dataset (SE, CS, EE)"
seed = 20261115
years = [1, 2]

[defaults]
access_rate = 0.03            # ~3-4 students need an accessible seat

# students / subjects: one number per year, [year 1, year 2]
# 0 students = that major has no cohort in that year

[majors.se]                   # SE - Software Engineering
students = [30, 20]
subjects = [3, 2]

[majors.cs]                   # CS - Computer Science
students = [30, 20]
subjects = [3, 2]

[majors.ee]                   # EE - Electrical Engineering (year 2 only)
students = [0, 20]
subjects = [0, 2]

[exam_period]
start_date = "2026-12-01"     # Tue 1 Dec - Thu 3 Dec
days = 3
slots = [["09:30", "12:30"], ["13:30", "16:30"]]

[timetable]
max_fill_percent = 80         # at most 102 of the 128 seats per session

[rooms]
accessible_front_cols = [1, 3, 5, 7]

[[rooms.groups]]              # r101, r102: 64 seats each
count = 2
rows = 8
cols = 8
available = true
